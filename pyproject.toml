[project]
name = "evidencemap"
version = "0.1.0"
description = "Deep-learning semantic search over scientific evidence with source traceability"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy ML packages are optional so the API stays light and Colab/Kaggle installs only what they need.
semantic = ["sentence-transformers>=3.0"]
ml = [
    "torch",
    "transformers",
    "sentence-transformers",
    "faiss-cpu",
    "rank-bm25",
    "pymupdf",
    "scikit-learn",
    "mlflow",
]
dev = ["pytest>=8.0", "ruff>=0.4"]
mlops = ["dvc>=3.0", "mlflow>=2.0"]

[tool.setuptools.packages.find]
include = ["backend*", "pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
